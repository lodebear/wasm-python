[package]
name = "mcpone-python-wasm-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "WASM guest runtime for MCP One sandbox - implements WIT exports via CPython"
readme = "README.md"
publish = false

# Build as staticlib, then use WASI SDK clang to create .so
# This matches how componentize-py builds their runtime
[lib]
crate-type = ["staticlib"]

[features]
default = []
# `core-net`: bind networking/TLS to PLAIN CORE imports in module "monocp"
# (wasi_snapshot_preview1 + monocp.tcp_*/dns_*/tls_*) instead of the wit-dylib
# component interfaces. Required for the THREADED preview1 CPython core module,
# which has no wit-dylib bindings. See src/core_net.rs.
core-net = []
# `threads-command`: emit a C `main()`-callable entry (mcpone_threads_main) that
# initializes the Python interpreter (registering the _mcpone builtins + socket/
# ssl shims) and runs a script, so the threaded core module is a runnable
# command. Implies core-net.
threads-command = ["core-net"]

[dependencies]
pyo3 = { workspace = true, features = ["abi3-py312"] } #unified
wit-dylib-ffi.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wit-component.workspace = true
wit-dylib.workspace = true
wit-parser.workspace = true
zstd.workspace = true

[lints]
workspace = true
