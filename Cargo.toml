[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lodebear/wasm-python"
authors = ["Michael"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
futures = "0.3"
pyo3 = { version = "0.27.2", features = ["extension-module"] }
sha2 = "0.10"
tempfile = "3.20"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
tracing = "0.1"
wasm-encoder = "0.243"
wasmparser = "0.243"
wasmtime = { version = "41", features = ["component-model", "async"] }
wasmtime-wasi = "41"
wasmtime-wizer = { version = "41", features = ["component-model", "wasmtime"] }
webpki-roots = "0.26"
wit-component = "0.243"
wit-dylib = "0.243"
wit-dylib-ffi = { path = "crates/wit-dylib-ffi" }
wit-parser = "0.243"
zip = "2.0"
zstd = "0.13"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
